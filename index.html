<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Travel & Explore</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            overflow: hidden;
            background-color: #050814;
            color: #ffffff;
        }

        /* Background Video */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
            opacity: 0.45;
        }

        /* Dark Gradient Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(10, 15, 35, 0.3) 0%, rgba(5, 8, 20, 0.85) 100%);
            z-index: -1;
        }

        /* 3D Globe Canvas */
        #globe-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            cursor: grab;
        }

        #globe-container:active {
            cursor: grabbing;
        }

        /* Glassmorphism Navigation Bar */
        nav {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            padding: 15px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 50px;
            z-index: 10;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: #e0e6ed;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #00f2fe;
        }

        /* Floating Glass Content Card */
        .hero-card {
            position: fixed;
            bottom: 40px;
            left: 50px;
            max-width: 420px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            z-index: 10;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .hero-card h1 {
            font-size: 2rem;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .hero-card p {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #050814;
            font-weight: 600;
            text-decoration: none;
            border-radius: 30px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 242, 254, 0.4);
        }

        /* Destination Info Panel (Right Side) */
        .info-panel {
            position: fixed;
            bottom: 40px;
            right: 50px;
            width: 280px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            z-index: 10;
            text-align: center;
        }

        .info-panel span {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #00f2fe;
        }

        .info-panel h3 {
            margin-top: 8px;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .hero-card { left: 20px; right: 20px; bottom: 20px; max-width: none; }
            .info-panel { display: none; }
        }
    </style>
</head>
<body>

    <!-- Background Video (Free stock earth/nature video) -->
    <video id="bg-video" autoplay loop muted playsinline>
        <source src="https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-1610-large.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <!-- Navigation -->
    <nav>
        <div class="logo">AERO•3D</div>
        <ul class="nav-links">
            <li><a href="#">Destinations</a></li>
            <li><a href="#">3D Map</a></li>
            <li><a href="#">Experiences</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- 3D Globe Container -->
    <div id="globe-container"></div>

    <!-- Left Glass Card -->
    <div class="hero-card">
        <h1>Explore The World in 3D</h1>
        <p>Drag the interactive globe to discover breathtaking destinations around the planet with real-time spatial navigation.</p>
        <a href="#" class="btn">Start Journey</a>
    </div>

    <!-- Right Glass Hint -->
    <div class="info-panel">
        <span>Interactive Mode</span>
        <h3>Drag to Rotate Globe</h3>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Setup Scene, Camera, Renderer
        const container = document.getElementById('globe-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 6;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Create 3D Globe Group
        const globeGroup = new THREE.Group();
        scene.add(globeGroup);

        // Inner Solid Core
        const coreGeometry = new THREE.SphereGeometry(1.8, 64, 64);
        const coreMaterial = new THREE.MeshPhongMaterial({
            color: 0x0a192f,
            emissive: 0x051024,
            specular: 0x4facfe,
            shininess: 30,
            transparent: true,
            opacity: 0.9
        });
        const coreMesh = new THREE.Mesh(coreGeometry, coreMaterial);
        globeGroup.add(coreMesh);

        // Outer Wireframe Grid (3D Tech Look)
        const wireGeometry = new THREE.SphereGeometry(1.84, 32, 32);
        const wireMaterial = new THREE.MeshBasicMaterial({
            color: 0x00f2fe,
            wireframe: true,
            transparent: true,
            opacity: 0.25
        });
        const wireMesh = new THREE.Mesh(wireGeometry, wireMaterial);
        globeGroup.add(wireMesh);

        // Glowing Atmosphere Ring
        const ringGeometry = new THREE.RingGeometry(2.1, 2.13, 64);
        const ringMaterial = new THREE.MeshBasicMaterial({
            color: 0x4facfe,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.4
        });
        const ringMesh = new THREE.Mesh(ringGeometry, ringMaterial);
        ringMesh.rotation.x = Math.PI / 2.5;
        ringMesh.rotation.y = Math.PI / 6;
        globeGroup.add(ringMesh);

        // Floating Particles around Globe
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 300;
        const posArray = new Float32Array(particlesCount * 3);

        for (let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 8;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.02,
            color: 0x00f2fe,
            transparent: true,
            opacity: 0.8
        });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x00f2fe, 1.5);
        pointLight.position.set(5, 3, 5);
        scene.add(pointLight);

        // Mouse Drag Interaction
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        container.addEventListener('mousedown', (e) => {
            isDragging = true;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaMove = {
                    x: e.offsetX - previousMousePosition.x,
                    y: e.offsetY - previousMousePosition.y
                };

                globeGroup.rotation.y += deltaMove.x * 0.005;
                globeGroup.rotation.x += deltaMove.y * 0.005;
            }
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
        });

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            if (!isDragging) {
                globeGroup.rotation.y += 0.003;
            }
            particlesMesh.rotation.y -= 0.0008;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
