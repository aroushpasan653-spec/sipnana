<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090e1a">
<title>Guest Access | NextGen Play</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
 margin:0;padding:0;box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}
:root{
 --bg:#090e1a;--text:#f8fafc;--muted:#94a3b8;
 --gold:#fbbf24;--amber:#f59e0b;--teal:#14b8a6;--emerald:#10b981;
}
html,body{
 width:100%;min-height:100%;
 overflow-x:hidden;
}
body{
 background:var(--bg);color:var(--text);
 font-family:Inter,sans-serif;
 transition:background .45s,color .45s;
}
button,a{font:inherit}
button,a{cursor:pointer}
a{color:inherit;text-decoration:none}

/* BACKGROUND */
.background{
 position:fixed;inset:0;z-index:-2;overflow:hidden;
 background:
 radial-gradient(circle at 50% 48%,rgba(56,189,248,.07),transparent 52%),
 radial-gradient(ellipse at 15% 18%,rgba(99,102,241,.13),transparent 45%),
 radial-gradient(ellipse at 85% 82%,rgba(20,184,166,.1),transparent 45%),
 #090e1a;
 transition:background .5s;
}
body.connected .background{
 background:
 radial-gradient(circle at 50% 50%,rgba(16,185,129,.18),transparent 54%),
 radial-gradient(circle at 50% 24%,rgba(251,191,36,.12),transparent 48%),
 #090e1a;
}
.orb{
 position:absolute;width:360px;height:360px;
 border-radius:50%;filter:blur(135px);opacity:.14;
 animation:floatOrb 12s ease-in-out infinite alternate;
}
.orb1{background:#6366f1;top:10%;left:-160px}
.orb2{background:#14b8a6;right:-170px;bottom:10%;animation-delay:-5s}
@keyframes floatOrb{
 to{transform:translate(80px,50px) scale(1.15)}
}

/* TOP BAR */
.top-bar{
 position:fixed;top:16px;left:16px;right:16px;
 display:flex;justify-content:space-between;align-items:center;
 z-index:300;pointer-events:none;
}
.top-bar>*{pointer-events:auto}
.top-right{display:flex;align-items:center;gap:10px}

.back-btn{
 display:inline-flex;align-items:center;gap:8px;
 padding:10px 15px;border-radius:14px;
 border:1px solid rgba(255,255,255,.14);
 background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
 backdrop-filter:blur(20px);color:#f8fafc;
 font-size:12px;font-weight:700;transition:.25s;
}
.back-btn:hover{transform:translateY(-2px);border-color:rgba(56,189,248,.45)}

.language-area{position:relative}
.language-button{
 display:flex;align-items:center;gap:8px;
 padding:10px 14px;border-radius:14px;
 border:1px solid rgba(255,255,255,.14);color:#f8fafc;
 background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
 backdrop-filter:blur(20px);font-size:12px;font-weight:700;transition:.25s;
}
.language-button:hover{transform:translateY(-2px);border-color:rgba(56,189,248,.45)}
.language-menu{
 position:absolute;top:52px;right:0;width:185px;padding:8px;
 border-radius:16px;border:1px solid rgba(255,255,255,.14);
 background:rgba(15,23,42,.97);backdrop-filter:blur(24px);
 box-shadow:0 20px 45px rgba(0,0,0,.6);
 opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);
 transform-origin:top right;transition:.2s;
}
.language-menu.open{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
.language-option{
 width:100%;display:flex;align-items:center;gap:10px;
 padding:10px;border:0;border-radius:10px;
 color:#f8fafc;background:transparent;text-align:left;
 font-size:12px;font-weight:600;
}
.language-option:hover,.language-option.selected{background:rgba(56,189,248,.14)}
.check{margin-left:auto;color:#38bdf8;opacity:0}
.language-option.selected .check{opacity:1}

.theme-switch{
 width:88px;height:42px;position:relative;
 border-radius:50px;border:1px solid rgba(255,255,255,.2);
 background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.03));
 backdrop-filter:blur(20px);overflow:hidden;
}
.theme-thumb{
 position:absolute;top:2px;left:2px;width:36px;height:36px;
 border-radius:50%;display:grid;place-items:center;
 background:linear-gradient(145deg,#fde68a,#f59e0b);
 transition:transform .45s cubic-bezier(.2,.9,.25,1.3),background .35s;
 z-index:2;
}
body:not(.light) .theme-thumb{
 transform:translateX(46px);
 background:linear-gradient(145deg,#475569,#1e293b);
}
.sun-icon,.moon-icon{position:absolute;top:10px;width:20px;height:20px}
.sun-icon{left:10px;color:#fff}
.moon-icon{right:10px;color:#cbd5e1}

/* MAIN WRAPPER */
.wrap{
 min-height:100vh;min-height:100dvh;
 width:100%;max-width:680px;
 margin:0 auto;padding:86px 18px 36px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
}

.badge{
 display:inline-flex;align-items:center;gap:8px;
 padding:7px 14px;border-radius:999px;
 background:rgba(56,189,248,.1);
 border:1px solid rgba(56,189,248,.28);
 color:#7dd3fc;font-size:10px;font-weight:800;letter-spacing:1.4px;
 margin-bottom:14px;
 transition:background .35s,border-color .35s,color .35s;
}
.badge-dot{
 width:7px;height:7px;border-radius:50%;
 background:#38bdf8;box-shadow:0 0 10px #38bdf8;
 animation:pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot{
 50%{transform:scale(1.28);opacity:.75}
}
body.connected .badge{
 background:rgba(16,185,129,.14);
 border-color:rgba(52,211,153,.45);
 color:#6ee7b7;
}
body.connected .badge-dot{
 background:#34d399;box-shadow:0 0 14px #34d399;
}

.title{
 font-family:"Space Grotesk",sans-serif;
 font-size:clamp(28px,6vw,40px);
 font-weight:800;letter-spacing:-1px;
 text-align:center;margin-bottom:8px;
}
.title span{
 background:linear-gradient(90deg,#7dd3fc,#38bdf8 50%,#34d399);
 -webkit-background-clip:text;background-clip:text;color:transparent;
}
.subtitle{
 font-size:12.5px;color:var(--muted);text-align:center;
 max-width:460px;line-height:1.7;margin-bottom:24px;
}

/* 3D GLASS CARD */
.glass-card{
 position:relative;
 width:100%;
 border-radius:28px;
 padding:26px;
 background:linear-gradient(155deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
 border:1px solid rgba(255,255,255,.15);
 backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
 box-shadow:
  0 30px 75px rgba(0,0,0,.6),
  inset 0 1px 1px rgba(255,255,255,.22),
  inset 0 -1px 1px rgba(0,0,0,.35);
 transform-style:preserve-3d;
 transition:transform .25s ease,box-shadow .4s ease,border-color .4s ease;
 overflow:hidden;
}
.glass-card::before{
 content:"";position:absolute;top:0;left:12%;right:12%;height:1px;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);
}
body.connected .glass-card{
 border-color:rgba(52,211,153,.48);
 box-shadow:
  0 32px 80px rgba(0,0,0,.6),
  0 0 46px rgba(16,185,129,.2),
  inset 0 1px 1px rgba(255,255,255,.28);
}

/* DRAG-TO-PLUG STAGE */
.cable-stage{
 position:relative;
 height:230px;
 border-radius:22px;
 background:linear-gradient(180deg,rgba(15,23,42,.72),rgba(10,16,30,.52));
 border:1px solid rgba(255,255,255,.1);
 box-shadow:inset 0 8px 26px rgba(0,0,0,.55);
 display:flex;align-items:center;justify-content:space-between;
 padding:0 28px;
 overflow:hidden;
 touch-action:none;
 user-select:none;
}

/* Guide track line */
.guide-track{
 position:absolute;
 top:50%;left:140px;right:112px;height:2px;
 transform:translateY(-50%);
 background:repeating-linear-gradient(
  90deg,
  rgba(148,163,184,.32) 0 8px,
  transparent 8px 16px
 );
 pointer-events:none;
 transition:opacity .35s;
}
body.connected .guide-track{opacity:0}

/* Power energy stream when connected */
.energy-stream{
 position:absolute;
 top:50%;left:90px;right:96px;height:4px;
 transform:translateY(-50%);
 border-radius:999px;
 background:linear-gradient(90deg,transparent,#38bdf8,#34d399,#fbbf24,transparent);
 opacity:0;filter:blur(2px);
 pointer-events:none;
 transition:opacity .4s;
}
body.connected .energy-stream{
 opacity:1;
 animation:streamPulse 1.4s ease-in-out infinite;
}
@keyframes streamPulse{
 0%,100%{transform:translateY(-50%) scaleX(.9);opacity:.55}
 50%{transform:translateY(-50%) scaleX(1.03);opacity:1}
}

/* Draggable 3D Plug */
.plug-unit{
 position:relative;z-index:5;
 display:flex;align-items:center;
 transform:translate3d(var(--drag-x, 0px), var(--drag-y, 0px), 0);
 transition:transform .42s cubic-bezier(.22,1.25,.36,1);
 cursor:grab;
}
.plug-unit.dragging{
 transition:none;
 cursor:grabbing;
}
.cable-tail{
 width:96px;height:11px;
 border-radius:999px 0 0 999px;
 background:linear-gradient(180deg,#64748b,#1e293b 65%,#0f172a);
 border:1px solid rgba(255,255,255,.2);
 box-shadow:0 8px 16px rgba(0,0,0,.55);
 transition:background .4s,box-shadow .4s;
}
body.connected .cable-tail{
 background:linear-gradient(180deg,#6ee7b7,#10b981 62%,#065f46);
 box-shadow:0 0 20px rgba(16,185,129,.5);
}
.plug-head{
 position:relative;
 width:46px;height:38px;
 border-radius:8px 12px 12px 8px;
 background:linear-gradient(160deg,rgba(255,255,255,.24),rgba(30,41,59,.92));
 border:1px solid rgba(255,255,255,.3);
 box-shadow:0 12px 24px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.45);
 display:flex;flex-direction:column;justify-content:center;align-items:flex-end;
 gap:8px;padding-right:3px;
}
.plug-grip{
 position:absolute;left:9px;top:7px;bottom:7px;width:14px;
 display:flex;flex-direction:column;justify-content:space-between;
 pointer-events:none;
}
.plug-grip span{
 height:2px;border-radius:2px;background:rgba(255,255,255,.25);
}
.prong{
 width:13px;height:4px;border-radius:0 3px 3px 0;
 background:linear-gradient(90deg,#cbd5e1,#ffffff);
 transform:translateX(12px);
 box-shadow:0 0 8px rgba(255,255,255,.4);
}

/* 3D Glass Socket with animated magnetic ring */
.socket-wrapper{
 position:relative;z-index:3;
 display:flex;align-items:center;justify-content:center;
}
.socket-ring{
 position:absolute;
 width:96px;height:96px;
 border-radius:28px;
 border:1.5px dashed rgba(56,189,248,.42);
 animation:ringSpin 10s linear infinite;
 pointer-events:none;
 transition:border-color .35s,transform .35s;
}
.socket-wrapper.target-hover .socket-ring{
 transform:scale(1.1);
 border-style:solid;
 border-color:rgba(52,211,153,.85);
}
body.connected .socket-ring{
 animation:none;
 border-style:solid;
 border-color:rgba(52,211,153,.75);
 box-shadow:0 0 24px rgba(16,185,129,.35);
}
@keyframes ringSpin{
 to{transform:rotate(360deg)}
}

.socket-unit{
 position:relative;
 width:78px;height:78px;
 border-radius:22px;
 background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(15,23,42,.82));
 border:1px solid rgba(255,255,255,.22);
 box-shadow:0 14px 28px rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.28);
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
 transition:border-color .35s,box-shadow .35s;
}
body.connected .socket-unit{
 border-color:rgba(52,211,153,.7);
 box-shadow:0 0 28px rgba(16,185,129,.38),inset 0 1px 1px rgba(255,255,255,.4);
}
.socket-slot{
 width:14px;height:6px;border-radius:4px;
 background:#020617;
 box-shadow:inset 0 2px 4px rgba(0,0,0,.9);
}
.socket-led{
 position:absolute;top:8px;right:8px;
 width:7px;height:7px;border-radius:50%;
 background:#38bdf8;box-shadow:0 0 9px rgba(56,189,248,.8);
 transition:background .35s,box-shadow .35s;
}
body.connected .socket-led{
 background:#34d399;box-shadow:0 0 14px #34d399;
}

.cable-caption{
 position:absolute;bottom:14px;left:12px;right:12px;
 text-align:center;font-size:11.5px;font-weight:600;
 color:#7dd3fc;letter-spacing:.3px;
 transition:color .35s;
}
body.connected .cable-caption{color:#6ee7b7}

/* LIGHT MODE */
body.light{--bg:#f4f6fa;--text:#0f172a;--muted:#64748b}
body.light .background{
 background:
 radial-gradient(circle at 50% 48%,rgba(56,189,248,.12),transparent 52%),
 #f4f6fa;
}
body.light .back-btn,body.light .language-button{
 color:#0f172a;background:rgba(255,255,255,.9);border-color:#cbd5e1;
}
body.light .language-menu{background:rgba(255,255,255,.98);border-color:#cbd5e1}
body.light .language-option{color:#0f172a}
body.light .glass-card{
 background:linear-gradient(155deg,rgba(255,255,255,.95),rgba(248,250,252,.85));
 border-color:#cbd5e1;
 box-shadow:0 24px 60px rgba(15,23,42,.12),inset 0 1px 1px #ffffff;
}
body.light .cable-stage{
 background:linear-gradient(180deg,rgba(241,245,249,.9),rgba(226,232,240,.7));
 border-color:#cbd5e1;
 box-shadow:inset 0 4px 16px rgba(15,23,42,.08);
}
body.light .badge{background:rgba(2,132,199,.1);color:#0369a1;border-color:rgba(2,132,199,.25)}
body.light .cable-caption{color:#0369a1}
body.light.connected .cable-caption{color:#047857}

@media(max-width:600px){
 .cable-stage{padding:0 16px;height:215px}
 .cable-tail{width:54px}
 .guide-track{left:92px;right:88px}
}
</style>
</head>
<body>

<div class="background">
 <div class="orb orb1"></div>
 <div class="orb orb2"></div>
</div>

<div class="top-bar">
 <a href="index.html" class="back-btn" data-i18n="backHome">← Home</a>

 <div class="top-right">
  <div class="language-area">
   <button class="language-button" id="languageButton">
    <span>🌐</span>
    <span id="currentLanguage">English</span>
    <span>▼</span>
   </button>
   <div class="language-menu" id="languageMenu">
    <button class="language-option selected" data-lang="en">
     <span>🇬🇧</span><span>English</span><span class="check">✓</span>
    </button>
    <button class="language-option" data-lang="si">
     <span>🇱🇰</span><span>සිංහල</span><span class="check">✓</span>
    </button>
    <button class="language-option" data-lang="ta">
     <span>🇮🇳</span><span>தமிழ்</span><span class="check">✓</span>
    </button>
   </div>
  </div>

  <button class="theme-switch" id="themeSwitch" aria-label="Toggle theme">
   <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>
   </svg>
   <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z"/>
   </svg>
   <span class="theme-thumb" id="themeThumb"></span>
  </button>
 </div>
</div>

<main class="wrap">
 <div class="badge">
  <span class="badge-dot"></span>
  <span data-i18n="badge">GUEST SESSION</span>
 </div>

 <h1 class="title">Guest <span>Access.</span></h1>
 <p class="subtitle" data-i18n="subtitle">
  Drag the plug into the socket to enter the home page as a guest.
 </p>

 <section class="glass-card" id="glassCard">
  <div class="cable-stage" id="cableStage">
   <div class="guide-track"></div>
   <div class="energy-stream"></div>

   <div class="plug-unit" id="plugUnit" role="button" tabindex="0" aria-label="Drag plug to socket">
    <div class="cable-tail"></div>
    <div class="plug-head">
     <div class="plug-grip"><span></span><span></span><span></span></div>
     <span class="prong"></span>
     <span class="prong"></span>
    </div>
   </div>

   <div class="socket-wrapper" id="socketWrapper">
    <div class="socket-ring"></div>
    <div class="socket-unit" id="socketUnit">
     <span class="socket-led"></span>
     <span class="socket-slot"></span>
     <span class="socket-slot"></span>
    </div>
   </div>

   <div class="cable-caption" id="cableCaption" data-i18n="dragHint">
    Drag the plug to the socket (or tap plug) to connect
   </div>
  </div>
 </section>
</main>

<script>
const i18n={
 en:{
  backHome:"← Home",badge:"GUEST SESSION",
  subtitle:"Drag the plug into the socket to enter the home page as a guest.",
  dragHint:"Drag the plug to the socket (or tap plug) to connect",
  connectedHint:"Connected! Opening Home page..."
 },
 si:{
  backHome:"← මුල් පිටුව",badge:"GUEST ප්‍රවේශය",
  subtitle:"Guest ලෙස Home Page එකට පිවිසීමට Plug එක ඇද Socket එකට සම්බන්ධ කරන්න.",
  dragHint:"සම්බන්ධ වීමට Plug එක ඇද Socket එකට ගෙන යන්න",
  connectedHint:"සම්බන්ධ වුණා! Home Page එක විවෘත වේ..."
 },
 ta:{
  backHome:"← முகப்பு",badge:"விருந்தினர் அமர்வு",
  subtitle:"விருந்தினராக முகப்புப் பக்கத்திற்குச் செல்ல பிளக்கை சாக்கெட்டில் இழுத்து இணைக்கவும்.",
  dragHint:"இணைய பிளக்கை இழுத்து சாக்கெட்டில் பொருத்தவும்",
  connectedHint:"இணைக்கப்பட்டது! முகப்புப் பக்கம் திறக்கிறது..."
 }
};

let lang=localStorage.getItem("nextgen_language")||"en";
let isConnected=false;

function playConnectSound(){
 try{
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type="sine";
  osc.frequency.setValueAtTime(520,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+0.13);
  gain.gain.setValueAtTime(0.08,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.15);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start();osc.stop(ctx.currentTime+0.15);
 }catch(e){}
}

function applyLang(newLang){
 if(!i18n[newLang])return;
 lang=newLang;
 const d=i18n[lang];
 document.querySelectorAll("[data-i18n]").forEach(el=>{
  const k=el.dataset.i18n;
  if(d[k] && k!=="dragHint")el.innerHTML=d[k];
 });
 document.getElementById("cableCaption").textContent=isConnected?d.connectedHint:d.dragHint;
 const names={en:"English",si:"සිංහල",ta:"தமிழ்"};
 document.getElementById("currentLanguage").textContent=names[lang];
 document.querySelectorAll(".language-option").forEach(o=>{
  o.classList.toggle("selected",o.dataset.lang===lang);
 });
 localStorage.setItem("nextgen_language",lang);
}

/* DRAG-TO-PLUG LOGIC */
const plugUnit=document.getElementById("plugUnit");
const socketWrapper=document.getElementById("socketWrapper");
const cableCaption=document.getElementById("cableCaption");

let dragging=false;
let movedDistance=0;
let startX=0,startY=0;
let currentX=0,currentY=0;

function getSnapOffset(){
 const pRect=plugUnit.getBoundingClientRect();
 const sRect=socketWrapper.getBoundingClientRect();
 const targetX=(sRect.left - sRect.width*0.42) - pRect.right + currentX;
 const targetY=(sRect.top + sRect.height/2) - (pRect.top + pRect.height/2) + currentY;
 return {x:targetX,y:targetY};
}

function setPlugPos(x,y){
 currentX=x;
 currentY=y;
 plugUnit.style.setProperty("--drag-x",`${x}px`);
 plugUnit.style.setProperty("--drag-y",`${y}px`);
}

function completeConnection(){
 if(isConnected)return;
 isConnected=true;
 dragging=false;
 plugUnit.classList.remove("dragging");
 socketWrapper.classList.remove("target-hover");

 const snap=getSnapOffset();
 setPlugPos(snap.x,snap.y);

 document.body.classList.add("connected");
 const d=i18n[lang]||i18n.en;
 cableCaption.textContent=d.connectedHint;
 localStorage.setItem("nextgen_guest_mode","true");
 playConnectSound();

 setTimeout(()=>{
  window.location.href="index.html";
 },750);
}

function checkProximityToSocket(){
 const pRect=plugUnit.getBoundingClientRect();
 const sRect=socketWrapper.getBoundingClientRect();
 const dx=(pRect.right)-(sRect.left+sRect.width*0.35);
 const dy=(pRect.top+pRect.height/2)-(sRect.top+sRect.height/2);
 const dist=Math.hypot(dx,dy);

 socketWrapper.classList.toggle("target-hover",dist<95);
 if(dist<58){
  completeConnection();
 }
}

plugUnit.addEventListener("pointerdown",e=>{
 if(isConnected)return;
 dragging=true;
 movedDistance=0;
 startX=e.clientX - currentX;
 startY=e.clientY - currentY;
 plugUnit.classList.add("dragging");
 plugUnit.setPointerCapture(e.pointerId);
});

plugUnit.addEventListener("pointermove",e=>{
 if(!dragging||isConnected)return;
 const nextX=e.clientX - startX;
 const nextY=e.clientY - startY;
 movedDistance+=Math.hypot(nextX-currentX,nextY-currentY);
 const clampedX=Math.max(-24,nextX);
 const clampedY=Math.max(-46,Math.min(46,nextY));
 setPlugPos(clampedX,clampedY);
 checkProximityToSocket();
});

plugUnit.addEventListener("pointerup",e=>{
 if(!dragging||isConnected)return;
 dragging=false;
 plugUnit.classList.remove("dragging");
 socketWrapper.classList.remove("target-hover");
 plugUnit.releasePointerCapture(e.pointerId);

 if(movedDistance<8){
  completeConnection();
  return;
 }
 setPlugPos(0,0);
});

plugUnit.addEventListener("keydown",e=>{
 if(e.key==="Enter"||e.key===" "){
  e.preventDefault();
  completeConnection();
 }
});

/* LANGUAGE & THEME */
const langBtn=document.getElementById("languageButton");
const langMenu=document.getElementById("languageMenu");
langBtn.addEventListener("click",()=>langMenu.classList.toggle("open"));
document.querySelectorAll(".language-option").forEach(opt=>{
 opt.addEventListener("click",()=>{applyLang(opt.dataset.lang);langMenu.classList.remove("open");});
});
document.addEventListener("click",e=>{if(!e.target.closest(".language-area"))langMenu.classList.remove("open");});

const themeSwitch=document.getElementById("themeSwitch");
function setTheme(t){
 const light=t==="light";
 document.body.classList.toggle("light",light);
 themeSwitch.setAttribute("aria-pressed",String(light));
 localStorage.setItem("nextgen_theme",t);
}
themeSwitch.addEventListener("click",()=>setTheme(document.body.classList.contains("light")?"dark":"light"));
setTheme(localStorage.getItem("nextgen_theme")||"dark");
applyLang(lang);

/* 3D CARD TILT */
const card=document.getElementById("glassCard");
if(window.matchMedia("(hover:hover) and (pointer:fine)").matches){
 card.addEventListener("mousemove",e=>{
  if(dragging)return;
  const r=card.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width;
  const y=(e.clientY-r.top)/r.height;
  card.style.transform=`perspective(1000px) rotateX(${(.5-y)*4.5}deg) rotateY(${(x-.5)*4.5}deg)`;
 });
 card.addEventListener("mouseleave",()=>{
  card.style.transform="perspective(1000px) rotateX(0) rotateY(0)";
 });
}
</script>
